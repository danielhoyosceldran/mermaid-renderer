<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- CodeMirror packages import each other by bare specifier; this maps them
       onto the vendored copies so the app still runs with no build step. -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "./vendor/codemirror/state.js",
      "@codemirror/view": "./vendor/codemirror/view.js",
      "@codemirror/language": "./vendor/codemirror/language.js",
      "@codemirror/commands": "./vendor/codemirror/commands.js",
      "@codemirror/autocomplete": "./vendor/codemirror/autocomplete.js",
      "@codemirror/search": "./vendor/codemirror/search.js",
      "@lezer/common": "./vendor/codemirror/lezer-common.js",
      "@lezer/highlight": "./vendor/codemirror/lezer-highlight.js",
      "@marijn/find-cluster-break": "./vendor/codemirror/find-cluster-break.js",
      "crelt": "./vendor/codemirror/crelt.js",
      "style-mod": "./vendor/codemirror/style-mod.js",
      "w3c-keyname": "./vendor/codemirror/w3c-keyname.js"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <div id="toolbar-left" class="toolbar-card">
      <span class="brand">Mermaid Renderer</span>
      <button id="btn-open">Open</button>
      <input id="file-input" type="file" accept=".mmd,.txt" hidden />
      <button id="btn-wrap" title="Toggle word wrap (Alt+Z)">Wrap</button>
      <button id="btn-br-wrap" title="Show &lt;br&gt; as a visual line break (display only)">&lt;br&gt; wrap</button>
      <button id="btn-suggestions" title="Toggle autocomplete suggestions">Suggestions</button>
    </div>
    <div id="toolbar-splitter"></div>
    <div id="toolbar-right" class="toolbar-card">
      <span class="hint">Ctrl+S save &middot; Ctrl+Shift+S export &middot; Ctrl+Enter render &middot; Ctrl+Space complete</span>
      <button id="btn-popout" title="Open preview in new window">Open in window</button>
      <button id="btn-settings" title="Editor settings">Settings</button>
    </div>
  </div>
  <div id="main">
    <div id="left-panel">
      <div id="editor-host"></div>
    </div>
    <div id="splitter"></div>
    <div id="right-panel">
      <div id="zoom-controls">
        <label id="zoom-speed-label" title="Zoom speed">
          <span>Zoom Speed</span>
          <button id="btn-zoom-speed-down" type="button" title="Decrease zoom speed">−</button>
          <input id="zoom-speed" type="range" min="0.01" max="0.6" step="0.01" />
          <button id="btn-zoom-speed-up" type="button" title="Increase zoom speed">+</button>
          <span id="zoom-speed-value"></span>
        </label>
        <button id="btn-zoom-out" title="Zoom out">−</button>
        <button id="btn-zoom-reset" title="Reset zoom">100%</button>
        <button id="btn-zoom-in" title="Zoom in">+</button>
      </div>
      <div id="viewport">
        <div id="output"></div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
